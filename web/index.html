<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Master of Magic</title>
    <style>
        :root {
            --bg: #120d08;
            --panel: #2a1f14;
            --text: #f1e4c8;
            --muted: #b9a582;
            --accent: #d9a441;
            --error: #ff8a7a;
        }

        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        #Loader {
            display: grid;
            place-content: center;
            gap: 16px;
            height: 100dvh;
            width: 100dvw;
            padding: 0 16px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: var(--accent);
            font-size: 40px;
            letter-spacing: 2px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--panel);
            padding: 24px;
            border-radius: 8px;
        }

        label {
            font-size: 20px;
        }

        input, button {
            font: inherit;
            font-size: 22px;
            padding: 10px 14px;
            border-radius: 6px;
            border: 2px solid var(--muted);
        }

        input {
            background: var(--bg);
            color: var(--text);
        }

        button {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
            cursor: pointer;
        }

        input:focus, button:focus {
            outline: 3px solid var(--text);
            outline-offset: 2px;
        }

        .status {
            font-size: 18px;
            color: var(--muted);
            min-height: 1.4em;
        }

        .status.error {
            color: var(--error);
        }

        progress {
            width: 100%;
        }

        [hidden] {
            display: none !important;
        }
    </style>

    <script src="wasm_exec.js"></script>
    <script>
    // must match util/lock-data
    const ITERATIONS = 600000
    const PASSWORD_KEY = "mom-password"

    function remember(key, value) {
        try {
            if (value === undefined) {
                return localStorage.getItem(key)
            } else if (value === null) {
                localStorage.removeItem(key)
            } else {
                localStorage.setItem(key, value)
            }
        } catch (e) {
            return null
        }
    }

    // download a file while updating the progress bar
    async function download(path, onProgress) {
        const response = await fetch(path)
        if (!response.ok) {
            throw new Error(`Unable to download ${path}: ${response.status}`)
        }

        const size = Number(response.headers.get("Content-Length")) || 0
        const reader = response.body.getReader()
        const chunks = []
        let loaded = 0

        while (true) {
            const {done, value} = await reader.read()
            if (done) {
                break
            }
            chunks.push(value)
            loaded += value.length
            onProgress(loaded, size)
        }

        const out = new Uint8Array(loaded)
        let offset = 0
        for (const chunk of chunks) {
            out.set(chunk, offset)
            offset += chunk.length
        }
        return out
    }

    // see util/lock-data for the format
    async function unlock(locked, password) {
        const magic = new TextDecoder().decode(locked.subarray(0, 4))
        if (magic !== "MOM1") {
            throw new Error("Game data file is damaged")
        }

        const salt = locked.subarray(4, 20)
        const nonce = locked.subarray(20, 32)
        const ciphertext = locked.subarray(32)

        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"])
        const key = await crypto.subtle.deriveKey(
            {name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: ITERATIONS},
            base, {name: "AES-GCM", length: 256}, false, ["decrypt"])

        // throws if the password is wrong
        const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: nonce}, key, ciphertext)
        return new Uint8Array(plain)
    }

    // saved games live in IndexedDB. everything is loaded up front so the game
    // can read saves synchronously, and writes go to IndexedDB in the background
    async function openSaves() {
        const saves = new Map()
        let db = null

        try {
            db = await new Promise((resolve, reject) => {
                const request = indexedDB.open("master-of-magic", 1)
                request.onupgradeneeded = () => request.result.createObjectStore("saves")
                request.onsuccess = () => resolve(request.result)
                request.onerror = () => reject(request.error)
            })

            await new Promise((resolve, reject) => {
                const store = db.transaction("saves").objectStore("saves")
                const request = store.openCursor()
                request.onsuccess = () => {
                    const cursor = request.result
                    if (cursor) {
                        saves.set(cursor.key, cursor.value)
                        cursor.continue()
                    } else {
                        resolve()
                    }
                }
                request.onerror = () => reject(request.error)
            })

            if (navigator.storage && navigator.storage.persist) {
                navigator.storage.persist()
            }
        } catch (e) {
            console.log("Saved games will not be kept: " + e)
            db = null
        }

        function write(action) {
            if (db === null) {
                return
            }
            try {
                action(db.transaction("saves", "readwrite").objectStore("saves"))
            } catch (e) {
                console.log("Unable to store saved game: " + e)
            }
        }

        return {
            names: () => Array.from(saves.keys()),
            get: (name) => saves.get(name),
            put: (name, data) => {
                const copy = new Uint8Array(data)
                saves.set(name, copy)
                write(store => store.put(copy, name))
            },
            remove: (name) => {
                saves.delete(name)
                write(store => store.delete(name))
            },
        }
    }

    let wasmDownload = null
    let dataDownload = null

    function startDownloads() {
        const progress = {wasm: [0, 0], data: [0, 0]}
        const bar = document.getElementById("load-bar")

        function update() {
            const loaded = progress.wasm[0] + progress.data[0]
            const size = progress.wasm[1] + progress.data[1]
            if (size > 0) {
                bar.value = Math.min(100, (loaded / size) * 100)
            }
        }

        wasmDownload = download("magic.wasm", (loaded, size) => { progress.wasm = [loaded, size]; update() })
        dataDownload = download("data.bin", (loaded, size) => { progress.data = [loaded, size]; update() })
        // avoid unhandled rejection warnings, the errors are reported in start()
        wasmDownload.catch(() => {})
        dataDownload.catch(() => {})
    }

    async function start(password) {
        const status = document.getElementById("status")
        const form = document.getElementById("unlock")
        const bar = document.getElementById("load-bar")

        status.classList.remove("error")
        form.hidden = true
        bar.hidden = false
        status.innerText = "Loading the game…"

        let data
        try {
            const locked = await dataDownload
            status.innerText = "Unlocking the spellbook…"
            data = await unlock(locked, password)
        } catch (e) {
            remember(PASSWORD_KEY, null)
            bar.hidden = true
            form.hidden = false
            status.classList.add("error")
            if (e.name === "OperationError") {
                status.innerText = "That password didn't work. Try again."
            } else {
                status.innerText = e.message
                // a failed download won't recover, try again from scratch next time
                dataDownload = download("data.bin", () => {})
                dataDownload.catch(() => {})
            }
            document.getElementById("password").focus()
            return
        }

        remember(PASSWORD_KEY, password)

        try {
            window.momData = data
            window.momSaves = await openSaves()

            const wasm = await wasmDownload
            const go = new Go()
            const result = await WebAssembly.instantiate(wasm, go.importObject)

            document.getElementById("Loader").remove()
            await go.run(result.instance)
        } catch (e) {
            bar.hidden = true
            status.classList.add("error")
            status.innerText = "The game failed to start: " + e.message
        }
    }

    function run() {
        startDownloads()

        const form = document.getElementById("unlock")
        form.addEventListener("submit", (event) => {
            event.preventDefault()
            const password = document.getElementById("password").value.trim()
            if (password !== "") {
                start(password)
            }
        })

        const saved = remember(PASSWORD_KEY)
        if (saved) {
            start(saved)
        } else {
            form.hidden = false
            document.getElementById("password").focus()
        }
    }
    </script>
</head>
<body onload="run()">

    <div id="Loader">
        <h1>Master of Magic</h1>
        <form id="unlock" hidden>
            <label for="password">Family password</label>
            <input id="password" type="password" autocomplete="current-password">
            <button type="submit">Play</button>
        </form>
        <progress id="load-bar" max="100" value="0" hidden></progress>
        <div id="status" class="status">&nbsp;</div>
    </div>

</body>
</html>
